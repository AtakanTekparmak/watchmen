[project]
name = "watchmen-daycare"
version = "0.1.0"
description = "Student-teacher skill distillation: evolve watchmen SKILL.md bundles via iterative LLM mutation against derived eval sets."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "rich>=13.7",
    "fastembed>=0.4",
    "dria-watchmen",
]

[tool.uv.sources]
dria-watchmen = { path = "../watchmen", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[project.scripts]
daycare = "daycare.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daycare"]

[tool.hatch.metadata]
allow-direct-references = true

# ─── Linting / formatting ─────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Match watchmen's minimal starter set: pyflakes + syntax/IO errors only.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
"src/daycare/__init__.py" = ["F401"]
"src/daycare/providers.py" = ["F401"]

# ─── Tests ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
