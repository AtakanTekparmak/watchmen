[project]
name = "kai-skills"
version = "0.1.0"
description = "Skill-folder evolution loops (autoreason / openevolve / hybrid) for the Hermes agent."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6.0",
    "swebench>=4.0",
    "datasets>=2.20",
    "huggingface-hub>=0.24",
    "hermes-agent[cli]",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]

[tool.uv.sources]
hermes-agent = { path = "hermes-agent", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["skill_evolve/tests", "skill_evolve/track_a/tests", "skill_evolve/track_b/tests", "skill_evolve/track_c/tests", "skill_evolve/compare/tests"]
markers = [
    "docker: tests that require a running Docker daemon (skipped by default)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_evolve"]
